name: feed
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node feeder.mjs
        env:
          FEED_SECRET: ${{ secrets.FEED_SECRET }}
          SITE: https://v4lens.pawww.sbs
